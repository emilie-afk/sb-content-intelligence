[build]
  publish   = "public"
  functions = "netlify/functions"

[build.environment]
  # @supabase/supabase-js 2.118 (locked) requires Node >= 22 (native WebSocket).
  # Functions must run on the same major: set AWS_LAMBDA_JS_RUNTIME = nodejs22.x in the
  # Netlify UI too and confirm "Node.js 22" in a function log (see docs/SECURITY-ROLLOUT.md).
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Security headers for the dashboard page. Authorization never relies on these.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
